[project]
name = "family-finances"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mirror the Lambda runtime: function code and the shared layer are importable.
pythonpath = ["src", "src/shared"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "plaid_sync", "telegram_bot", "aggregation"]
